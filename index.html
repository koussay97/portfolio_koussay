<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- 1. Browser Tab Name & Core SEO -->
    <title>Arkana Labs | Senior Software Architect & Mobile Engineer</title>
    <meta name="description" content="Portfolio of a Senior Software Engineer and Architect specializing in Flutter, Monorepos, DDD, and scalable backend infrastructure.">
    <meta name="author" content="Arkana Labs">

    <!-- 2. Chrome Tab Icon (Favicon) -->
    <!-- Modern browsers support crisp SVG favicons -->
    <!--<link rel="icon" type="image/svg+xml" href="./assets/favicon.svg">-->
    <!-- Fallback for older browsers (Optional: save a 32x32 png as favicon.png) -->
    <link rel="icon" type="image/png" href="./assets/identity/logo.png">
    <!-- Apple Touch Icon for when users save your site to their iPhone home screen -->
    <link rel="apple-touch-icon" href="./assets/identity/logo.png">

    <!-- 3. LinkedIn / Open Graph / Facebook Meta Tags -->
    <!-- Title that appears in the link preview -->
    <meta property="og:title" content="Arkana Labs | Senior Software Architect">
    <!-- Description that appears below the title -->
    <meta property="og:description" content="We build software that stands the test of time. Discover architectural capabilities, domain-driven design, and deployed systems.">
    <!-- THE THUMBNAIL IMAGE (Must be an absolute URL when deployed to production) -->
    
    <!-- Example: https://yourusername.github.io/portfolio/assets/og-image.jpg -->
    <meta property="og:image" content="https://koussay97.github.io/portfolio_koussay/assets/white_thumbnail_moz.jpg">
    <meta property="og:url" content="https://koussay97.github.io/">
    <meta property="og:type" content="website">

    <!-- Twitter specific tags (LinkedIn also uses these as a fallback) -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Arkana Labs | Senior Software Architect">
    <meta name="twitter:description" content="We build software that stands the test of time.">
    <meta name="twitter:image" content="https://koussay97.github.io/portfolio_koussay/assets/white_thumbnail_moz.jpg">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- External Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>

    <!-- Stylesheets -->
    <link rel="stylesheet" href="./style/main.css">
    <link rel="stylesheet" href="./style/nav.css">
    <link rel="stylesheet" href="./style/hero.css">
    <link rel="stylesheet" href="./style/about.css">
    <link rel="stylesheet" href="./style/tech.css">
    <link rel="stylesheet" href="./style/projects.css">
    <link rel="stylesheet" href="./style/personal.css">
    <link rel="stylesheet" href="./style/contact.css">
</head>
<body>

    <div data-template="nav"></div>
    <div data-template="hero"></div>
    <div data-template="about"></div>
    <div data-template="tech"></div>
    <div data-template="projects-grid"></div>
    <div data-template="personal"></div> <!-- NEW -->
    <div data-template="contact"></div> <!-- NEW (Includes Footer) -->

    <!-- Lightbox Overlay -->
    <div id="lightbox" class="lightbox">
        <span class="lightbox-close">&times;</span>
        <img class="lightbox-content" src="" alt="Lightbox Image">
    </div>

    <!-- Application Logic -->
    <script type="module" src="./js/main.js"></script>
</body>
</html>
