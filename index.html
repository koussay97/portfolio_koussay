<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- ========================================== -->
    <!-- 0. GOOGLE CONSENT MODE V2 & GTM (MUST BE FIRST) -->
    <!-- ========================================== -->
    <script>
      // Initialize dataLayer
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      
      // Synchronously check localStorage for previous consent to prevent race conditions
      var hasConsent = false;
      try {
        var raw = localStorage.getItem('arkana_consent_state');
        if (raw) {
            var data = JSON.parse(raw);
            if (data.analytics_storage && data.analytics_storage.granted) hasConsent = true;
        }
      } catch(e) {}

      var defaultState = hasConsent ? 'granted' : 'denied';

      // Set default consent state BEFORE GTM loads
      gtag('consent', 'default', {
        'analytics_storage': defaultState,
        'ad_storage': defaultState,
        'ad_user_data': defaultState,
        'ad_personalization': defaultState,
        'security_storage': 'granted',
        'functionality_storage': 'granted',
        'wait_for_update': 500
      });
      gtag('set', 'url_passthrough', true);
    </script>

    <!-- Google Tag Manager -->
    <script>(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
    new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
    j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
    'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
    })(window,document,'script','dataLayer','GTM-TWRWHGNK');</script>
    <!-- End Google Tag Manager -->


    <!-- 1. Browser Tab Name & Core SEO -->
    <title>Arkana Labs | Senior Software Architect & Mobile Engineer</title>
    <meta name="description" content="Portfolio of a Senior Software Engineer and Architect specializing in Flutter, Monorepos, DDD, and scalable backend infrastructure.">
    <meta name="author" content="Arkana Labs">

    <!-- 2. Chrome Tab Icon (Favicon) -->
    <link rel="icon" type="image/png" href="./assets/identity/logo.png">
    <link rel="apple-touch-icon" href="./assets/identity/logo.png">

    <!-- 3. LinkedIn / Open Graph / Facebook Meta Tags -->
    <meta property="og:title" content="Arkana Labs | Senior Software Architect">
    <meta property="og:description" content="We build software that stands the test of time. Discover architectural capabilities, domain-driven design, and deployed systems.">
    <!-- FIX: Removed the double << typo from the line below -->
    <meta property="og:image" content="https://koussay97.github.io/portfolio_koussay/assets/identity/white_thumbnail_moz.jpg">
    <meta property="og:url" content="https://koussay97.github.io/portfolio_koussay/">
    <meta property="og:type" content="website">

    <!-- Twitter specific tags -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Arkana Labs | Senior Software Architect">
    <meta name="twitter:description" content="We build software that stands the test of time.">
    <meta name="twitter:image" content="https://koussay97.github.io/portfolio_koussay/assets/identity/white_thumbnail_moz.jpg">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- External Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>

    <!-- Stylesheets -->
    <link rel="stylesheet" href="./style/main.css">
    <link rel="stylesheet" href="./style/nav.css">
    <link rel="stylesheet" href="./style/hero.css">
    <link rel="stylesheet" href="./style/about.css">
    <link rel="stylesheet" href="./style/tech.css">
    <link rel="stylesheet" href="./style/projects.css">
    <link rel="stylesheet" href="./style/personal.css">
    <link rel="stylesheet" href="./style/contact.css">
    <link rel="stylesheet" href="./style/consent.css"> <!-- Assuming you saved your banner CSS here -->
</head>
<body>
    
    <!-- Google Tag Manager (noscript) -->
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-TWRWHGNK"
    height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
    <!-- End Google Tag Manager (noscript) -->

    <!-- SEMANTIC UPGRADE: Explicitly defining the global header -->
    <header id="global-navigation" role="banner">
        <div data-template="nav"></div>
    </header>

    <!-- SEMANTIC UPGRADE: <main> tells AI/Screen Readers "This is the core content" -->
    <main id="main-content" role="main">
        <div data-template="hero"></div>
        <div data-template="about"></div>
        <div data-template="tech"></div>
        <div data-template="projects-grid"></div>
        
        <aside aria-label="Research and Experiments">
            <div data-template="personal"></div>
        </aside>
    </main>

    <!-- SEMANTIC UPGRADE: Explicitly defining the footer/contact area -->
    <footer id="global-footer" role="contentinfo">
        <div data-template="contact"></div>
    </footer>

    <!-- Lightbox Overlay -->
    <div id="lightbox" class="lightbox">
        <span class="lightbox-close">&times;</span>
        <img class="lightbox-content" src="" alt="Lightbox Image">
    </div>

    <!-- Application Logic -->
    <script type="module" src="./js/main.js"></script>

    <!-- Consent Banner UI (Injected directly or via template, depending on your setup) -->
    <div id="arkana-consent-banner" class="consent-banner">
        <div class="consent-text">
            <p><strong>Telemetry & Analytics</strong><br>We utilize local storage to periodically sync anonymized session metrics and funnel progression to evaluate architectural interest. You may opt out of non-essential storage.</p>
        </div>
        <div class="consent-actions">
            <button id="btn-consent-necessary" class="consent-btn btn-reject">Necessary Only</button>
            <button id="btn-consent-all" class="consent-btn btn-accept">Acknowledge & Accept</button>
        </div>
    </div>
</body>
</html>
